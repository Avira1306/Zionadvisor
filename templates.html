  <title>Templates — Zion Advisor</title>
  <meta name="description" content="Download Zion Advisor's investor-ready databook template and request financial model and transaction advisory packs." />

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/styles.css" />

  <style>
    body{font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;background:#f6f9fc}
    .svc-banner{position:relative;background-position:center;background-size:cover;background-repeat:no-repeat;color:#fff;display:block;overflow:hidden;padding:92px 20px}
    .svc-banner::before{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(6,18,30,.62) 0%,rgba(6,18,30,.62) 100%);z-index:1}
    .svc-banner .inner{position:relative;z-index:2;max-width:1100px;margin:0 auto}
    .svc-banner .inner h1{margin:0 0 8px;font-weight:800;font-size:clamp(30px,4vw,46px);color:#fff;line-height:1.12;max-width:820px}
    .svc-banner .inner p{color:rgba(255,255,255,.92);margin:6px 0 0;max-width:760px;font-size:16px;line-height:1.6}
    .template-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:20px;margin-top:22px}
    .template-card{background:#fff;border:1px solid #e6edf4;border-radius:10px;padding:20px;box-shadow:0 8px 24px rgba(11,19,32,.05);display:flex;flex-direction:column;gap:10px}
    .template-card h2{margin:0;font-size:20px;color:#0a2239}
    .template-card p{margin:0;color:#4a5568;font-size:14px;line-height:1.55}
    .template-status{font-size:13px;color:#5b6572;font-weight:700}
    .btn-download,.btn-request{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:10px 14px;border-radius:8px;text-decoration:none;font-size:14px;font-weight:800;transition:.2s;margin-top:auto}
    .btn-download{background:#0b66c2;color:#fff}.btn-download:hover{background:#094d94}
    .btn-request{background:#eef6ff;color:#0b66c2;border:1px solid #cfe3f8}.btn-request:hover{background:#ddecfb}
    .gate{max-width:620px;margin:0 auto;text-align:center;background:#fff;border:1px solid #e6edf4;border-radius:10px;padding:24px;box-shadow:0 8px 24px rgba(11,19,32,.05)}
    .gate .row{display:grid;grid-template-columns:1fr 1fr;gap:12px;text-align:left}
    .gate input{width:100%;padding:11px;border:1px solid #cdd6e1;border-radius:8px;margin-top:6px}
    .btn{display:inline-flex;align-items:center;gap:8px;background:#2bd887;color:#0b1118;padding:11px 16px;border:0;border-radius:8px;font-weight:800;text-decoration:none;cursor:pointer}
    .small{font-size:13px;color:#6b7480;line-height:1.5}
    .download-panel{display:none;margin-top:22px;text-align:center;background:#fff;border:1px solid #e6edf4;border-radius:10px;padding:22px;box-shadow:0 8px 24px rgba(11,19,32,.05)}
    .download-actions{display:flex;gap:14px;justify-content:center;flex-wrap:wrap;margin-top:14px}
    @media(max-width:700px){.gate .row{grid-template-columns:1fr}.svc-banner{padding:72px 20px}}
  </style>
