  <title>Services — Zion Advisor</title>
  <meta name="description" content="Zion Advisor — Databooks, AI automation, infrastructure advisory and market intelligence." />
  <link rel="stylesheet" href="/styles.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
  <style>
    /* Scoped services (safe to paste into styles.css instead) */
    :root{--svc-accent:#0b66c2;--svc-muted:#5b6572;--card-bg:#fff;--card-border:#e6edf4;--card-shadow:0 8px 20px rgba(17,24,39,0.06)}
    .services-banner{width:100%;height:240px;background-image:url('/assets/banner-services.jpg');background-size:cover;background-position:center;display:flex;align-items:center;border-bottom:1px solid var(--card-border)}
    .services-banner .banner-inner{max-width:1100px;margin:0 auto;padding:24px}
    .services-banner .eyebrow{display:inline-block;font-weight:700;color:var(--svc-accent);font-size:13px;text-transform:uppercase;letter-spacing:.06em;margin-bottom:8px}
    .services-banner h1{color:#fff;text-shadow:0 6px 18px rgba(0,0,0,0.32);margin:6px 0 0;font-size:clamp(30px,4.5vw,44px)}
    .services-container{max-width:1100px;margin:36px auto;padding:0 20px 60px}
    .services-intro{text-align:center;max-width:880px;margin:0 auto 28px;color:#566270;font-size:15px}
    .services-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:22px;align-items:start}
    .service-card{background:var(--card-bg);border:1px solid var(--card-border);border-radius:12px;padding:20px;box-shadow:var(--card-shadow);display:flex;flex-direction:column;min-height:260px;transition:transform .18s ease,box-shadow .18s ease}
    .service-card:hover{transform:translateY(-6px);box-shadow:0 14px 32px rgba(17,24,39,0.08)}
    .service-icon{width:56px;height:56px;border-radius:10px;display:inline-flex;align-items:center;justify-content:center;background:linear-gradient(180deg,rgba(11,102,194,0.12),rgba(11,102,194,0.06));color:var(--svc-accent);font-size:22px;margin-bottom:12px}
    .service-card h3{margin:6px 0 10px;font-size:18px;color:#0b0f14}
    .service-card p.lead{margin:0 0 14px;color:var(--svc-muted);font-size:14px;line-height:1.5;flex:1 1 auto}
    .service-card .meta{font-size:13px;color:var(--svc-muted);margin-bottom:10px}
    .service-card .btn-lean{text-decoration:none;background:var(--svc-accent);color:#fff;padding:10px 14px;border-radius:8px;font-weight:700}
    .service-card .link-muted{color:var(--svc-accent);font-weight:700;text-decoration:none}
    @media(max-width:1000px){.services-grid{grid-template-columns:repeat(2,1fr)}.services-banner{height:210px}}
    @media(max-width:640px){.services-grid{grid-template-columns:1fr}.services-banner{height:160px}.service-card{padding:16px}}
  </style>
