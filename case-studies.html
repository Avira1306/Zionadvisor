<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Case Studies — Zion Advisor</title>
  <meta name="description" content="Case studies from Zion Advisor — M&A databooks, AI automation, and transaction advisory delivered with measurable outcomes." />

  <link rel="stylesheet" href="/styles.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

  <style>
    /* Minimal scoped styles (matches Services look) */
    .services-banner { width:100%; height:240px; background-image:url('/assets/banner-services.jpg'); background-size:cover; background-position:center; display:flex; align-items:center; border-bottom:1px solid #e6edf4; position:relative; color:#fff; }
    .services-banner::before { content:""; position:absolute; inset:0; background:linear-gradient(180deg, rgba(0,0,0,0.34), rgba(0,0,0,0.34)); z-index:0; }
    .banner-inner { max-width:1100px; margin:0 auto; padding:22px; position:relative; z-index:1; }
    .eyebrow{display:inline-block;font-weight:700;color:#dbeeff;font-size:13px;text-transform:uppercase;letter-spacing:.06em;margin-bottom:8px}
    .banner-inner h1{color:#fff;text-shadow:0 6px 18px rgba(0,0,0,0.32);margin:6px 0 0;font-size:clamp(28px,4.5vw,44px);line-height:1.05}
    .banner-inner p{color:rgba(255,255,255,0.95);max-width:880px;margin-top:8px}

    .case-container{max-width:1100px;margin:0 auto;padding:40px 20px 60px}
    .grid{display:grid;grid-template-columns:repeat(3,1fr);gap:24px;margin-top:28px}
    .card{background:#fff;border:1px solid #e6edf4;border-radius:12px;padding:22px;box-shadow:0 8px 20px rgba(17,24,39,0.04);display:flex;flex-direction:column;transition:transform .2s ease,box-shadow .2s ease}
    .card:hover{transform:translateY(-4px);box-shadow:0 10px 24px rgba(17,24,39,0.08)}
    .badge{display:inline-block;background:#0b66c2;color:#fff;border-radius:999px;padding:5px 10px;font-size:12px;font-weight:700;margin-bottom:10px}
    .card h3{margin:0 0 10px;font-size:18px;line-height:1.3}
    .sect h4{margin:0 0 4px;font-size:14px;color:#0b1620}
    .sect ul{margin:0 0 10px 18px;padding:0;color:#2a3440;line-height:1.55}
    .impact{background:#f6f9fc;border:1px solid #e6edf4;border-radius:10px;padding:10px;margin-top:auto}
    .cta-row{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}
    .btn{display:inline-block;padding:10px 14px;border-radius:8px;font-weight:700;text-decoration:none;background:#0d6efd;color:#fff}
    .btn.secondary{background:#eef2f7;color:#0b0f14;border:1px solid #d7dde6}
    @media(max-width:960px){.grid{grid-template-columns:1fr}.services-banner{height:180px}}
  </style>
