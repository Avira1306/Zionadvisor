  <meta name="description" content="Contact Zion Advisor for investor-ready databooks, FDD support, financial models, and AI finance automation workflows.">

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/styles.css" />
  <style>
    body { font-family: Inter, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif; background:#f6f9fc; }
    .contact-hero { background:#0b1220; color:#fff; padding:72px 20px; }
    .contact-hero .inner { max-width: 980px; margin:0 auto; }
    .contact-hero h1 { font-size: clamp(34px, 5vw, 54px); margin: 8px 0 14px; color:#fff; }
    .contact-hero p { color:#d8e1ea; max-width:720px; margin:0; font-size:17px; line-height:1.6; }
    .contact-wrap { max-width: 1100px; margin: 48px auto 72px; padding: 0 20px; display:grid; grid-template-columns:.9fr 1.1fr; gap:28px; align-items:start; }
    .trust-panel, .form-panel { background:#fff; border:1px solid #e6edf4; border-radius:10px; box-shadow:0 10px 28px rgba(11,19,32,.05); padding:24px; }
    .trust-panel h2, .form-panel h2 { margin-top:0; }
    .trust-list { list-style:none; padding:0; margin:18px 0 0; display:grid; gap:14px; }
    .trust-list li { display:flex; gap:12px; color:#435063; line-height:1.55; }
    .trust-list i { color:#0b66c2; margin-top:4px; }
    .form-grid { display:grid; grid-template-columns:1fr 1fr; gap:14px; }
    label { color:#253243; font-weight:700; font-size:14px; }
    .input, select, textarea { width:100%; padding:12px; margin-top:7px; border:1px solid #cdd6e1; border-radius:8px; font-size:15px; background:#fff; }
    textarea { min-height:150px; resize:vertical; }
    .full { grid-column:1 / -1; }
    .btn { background:#0b66c2; color:#fff; padding:12px 18px; border:none; border-radius:8px; cursor:pointer; font-weight:800; display:inline-flex; align-items:center; gap:8px; }
    .btn:hover { background:#094d94; }
    .small-note { color:#687586; font-size:13px; line-height:1.5; margin:10px 0 0; }
    #formStatus { color:#435063; font-size:14px; margin-top:12px; display:none; }
    @media(max-width:860px){ .contact-wrap { grid-template-columns:1fr; } .form-grid { grid-template-columns:1fr; } }
  </style>
